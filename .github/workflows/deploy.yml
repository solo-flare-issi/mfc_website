name: Build and deploy site

on:
  push:
    branches: [main]
  # Allows the workflow to be run by hand from the Actions tab.
  workflow_dispatch:

# Permissions needed by the GitHub Pages deployment action.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one deployment at a time; do not cancel a run that is mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build the site
        run: sphinx-build -b html docs _build/html -W --keep-going

      # Belt and braces: stops any Jekyll processing from dropping the
      # underscore-prefixed directories Sphinx generates (_static, _images).
      - name: Disable Jekyll
        run: touch _build/html/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
